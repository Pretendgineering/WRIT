[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "writ"
version = "0.2.1"
description = "Lightning-fast terminal Bible reference and reading tool"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-only"}
authors = [
    {name = "Spasm0dic"},
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
]

[project.urls]
Homepage   = "https://github.com/Spasm0dic/WRIT"
Repository = "https://github.com/Spasm0dic/WRIT"
Issues     = "https://github.com/Spasm0dic/WRIT/issues"

[project.scripts]
writ = "writ.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov"]

[tool.hatch.build.targets.wheel]
packages = ["writ"]

[tool.pytest.ini_options]
testpaths = ["tests"]
